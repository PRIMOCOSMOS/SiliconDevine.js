[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicondevine"
version = "0.1.0"
description = "PyTorch graph exporter for SiliconDevine.js"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
